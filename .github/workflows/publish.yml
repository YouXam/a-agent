name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install terminal test dependencies
        run: sudo apt-get update && sudo apt-get install --yes fish tmux
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Verify tag matches Cargo version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Verify package
        run: cargo publish --dry-run --locked
      - name: Check whether this version is already on crates.io
        id: registry
        shell: bash
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          name="$(jq -r '.packages[0].name' <<<"$metadata")"
          version="$(jq -r '.packages[0].version' <<<"$metadata")"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "$name-release-check/$version (https://github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/$name/$version")"
          case "$status" in
            200) echo "published=true" >>"$GITHUB_OUTPUT" ;;
            404) echo "published=false" >>"$GITHUB_OUTPUT" ;;
            *) echo "unexpected crates.io status $status" >&2; exit 1 ;;
          esac
      - name: Authenticate with crates.io
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: cargo publish --locked
      - name: Report already published
        if: steps.registry.outputs.published == 'true'
        run: echo "This version is already on crates.io; skipping upload."
