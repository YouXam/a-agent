[package]
name = "a-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Fast, terminal-native coding agent with progressive context"
license = "MIT"
readme = "README.md"
repository = "https://github.com/YouXam/a-agent"
homepage = "https://github.com/YouXam/a-agent"
publish = false

[[bin]]
name = "a"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-openai = { version = "0.41.3", default-features = false, features = ["rustls", "responses", "chat-completion", "byot"] }
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
dialoguer = "0.12"
futures-util = "0.3"
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rustyline = { version = "18.0.1", default-features = false, features = ["custom-bindings"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strip-ansi-escapes = "0.2"
tempfile = "3.23"
threatflux-anthropic-sdk = { version = "0.3.0", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width", "in_memory"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
